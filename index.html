<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>대고그려</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        #camera {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #overlay {
            position: fixed;
            pointer-events: none;
            z-index: 2;
            transform-origin: 0 0;
            display: none;
        }

        .corner {
            position: fixed;
            width: 48px; height: 48px;
            z-index: 20;
            display: none;
            touch-action: none;
        }

        .corner::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 18px; height: 18px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255, 64, 129, 0.8);
            border: 2.5px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .corner.dragging::after {
            width: 24px; height: 24px;
            background: #ff4081;
        }

        .corner-line {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 15;
            pointer-events: none;
            display: none;
        }

        .corner-line.moving polygon {
            stroke: rgba(100, 200, 255, 0.7);
            stroke-width: 2.5;
        }

        .ui { position: fixed; z-index: 30; }

        .bottom-bar {
            bottom: 0; left: 0; right: 0;
            padding: 12px 20px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            touch-action: auto;
        }

        .slider-wrap {
            width: 85%;
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 14px;
            touch-action: auto;
        }

        .slider-wrap.show { display: flex; }

        .slider-wrap label {
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            min-width: 36px;
        }

        .slider-wrap input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            outline: none;
            touch-action: auto;
        }

        .slider-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: #ff4081;
            border: 2.5px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .slider-wrap span {
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            min-width: 34px;
            text-align: right;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            touch-action: auto;
        }

        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.15s;
            touch-action: auto;
        }

        .btn:active { transform: scale(0.95); }

        .btn-primary {
            background: #ff4081;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            display: none;
        }

        .btn-secondary.show { display: flex; }

        #file-input { display: none; }

        .move-hint {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .move-hint.show { opacity: 1; }

        .error-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            background: #111;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            color: #fff;
        }

        .error-screen.show { display: flex; }
        .error-screen .icon { font-size: 48px; margin-bottom: 20px; }
        .error-screen h2 { font-size: 20px; margin-bottom: 12px; }
        .error-screen p { font-size: 14px; color: #aaa; line-height: 1.6; }
        .error-screen .btn { margin-top: 24px; }
    </style>
</head>
<body>
    <video id="camera" autoplay playsinline muted></video>
    <img id="overlay" alt="">

    <svg class="corner-line" id="cornerLine" width="100%" height="100%">
        <polygon id="cornerPoly" fill="none" stroke="rgba(255,64,129,0.5)" stroke-width="2" stroke-dasharray="6,4"/>
    </svg>

    <div class="corner" id="c0"></div>
    <div class="corner" id="c1"></div>
    <div class="corner" id="c2"></div>
    <div class="corner" id="c3"></div>

    <div class="move-hint" id="moveHint">이동 모드</div>

    <div class="bottom-bar ui" id="bottomBar">
        <div class="slider-wrap" id="opacityWrap">
            <label>투명도</label>
            <input type="range" id="opacitySlider" min="0" max="100" value="50">
            <span id="opacityVal">50%</span>
        </div>
        <div class="slider-wrap" id="sizeWrap">
            <label>크기</label>
            <input type="range" id="sizeSlider" min="10" max="200" value="100">
            <span id="sizeVal">100%</span>
        </div>
        <div class="slider-wrap" id="zoomWrap">
            <label>줌</label>
            <input type="range" id="zoomSlider" min="100" max="500" value="100" step="10">
            <span id="zoomVal">1.0x</span>
        </div>
        <div class="btn-row">
            <button class="btn btn-secondary" id="changeBtn">사진 변경</button>
            <button class="btn btn-primary" id="uploadBtn">사진 선택</button>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <div class="error-screen" id="errorScreen">
        <div class="icon">📷</div>
        <h2>카메라 접근이 필요합니다</h2>
        <p>이 앱은 카메라를 사용하여 종이 위에 그림을 따라 그릴 수 있게 해줍니다. 브라우저 설정에서 카메라 접근을 허용해주세요.</p>
        <button class="btn btn-primary" id="retryBtn">다시 시도</button>
    </div>

    <script>
        var camera = document.getElementById('camera');
        var overlay = document.getElementById('overlay');
        var opacitySlider = document.getElementById('opacitySlider');
        var opacityWrap = document.getElementById('opacityWrap');
        var opacityVal = document.getElementById('opacityVal');
        var sizeSlider = document.getElementById('sizeSlider');
        var sizeWrap = document.getElementById('sizeWrap');
        var sizeVal = document.getElementById('sizeVal');
        var zoomSlider = document.getElementById('zoomSlider');
        var zoomWrap = document.getElementById('zoomWrap');
        var zoomVal = document.getElementById('zoomVal');
        var uploadBtn = document.getElementById('uploadBtn');
        var changeBtn = document.getElementById('changeBtn');
        var fileInput = document.getElementById('file-input');
        var errorScreen = document.getElementById('errorScreen');
        var retryBtn = document.getElementById('retryBtn');
        var cornerLine = document.getElementById('cornerLine');
        var cornerPoly = document.getElementById('cornerPoly');
        var moveHint = document.getElementById('moveHint');
        var bottomBar = document.getElementById('bottomBar');
        var cornerEls = [
            document.getElementById('c0'),
            document.getElementById('c1'),
            document.getElementById('c2'),
            document.getElementById('c3')
        ];

        var wakeLockSentinel = null;
        var videoTrack = null;
        var zoomRange = null;

        var imgNatW = 0, imgNatH = 0;
        var baseRect = { x: 0, y: 0, w: 0, h: 0 };
        var corners = [[0,0],[0,0],[0,0],[0,0]];
        var imageLoaded = false;

        // ── Camera ──

        async function startCamera() {
            try {
                var devices = await navigator.mediaDevices.enumerateDevices();
                var videoDevices = devices.filter(function(d) { return d.kind === 'videoinput'; });
                var backCams = videoDevices.filter(function(d) {
                    var l = d.label.toLowerCase();
                    return l.includes('back') || l.includes('rear') || l.includes('0');
                });
                var target = backCams.length > 0 ? backCams[0] : null;

                var constraints = {
                    video: target
                        ? { deviceId: { exact: target.deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
                        : { facingMode: { exact: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                };

                var stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoTrack = stream.getVideoTracks()[0];

                var caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (caps.zoom) {
                    zoomRange = caps.zoom;
                    zoomSlider.min = Math.round(zoomRange.min * 100);
                    zoomSlider.max = Math.round(zoomRange.max * 100);
                    zoomSlider.value = Math.round(zoomRange.min * 100);
                    zoomVal.textContent = zoomRange.min.toFixed(1) + 'x';
                    zoomWrap.classList.add('show');
                }

                camera.srcObject = stream;
                errorScreen.classList.remove('show');
            } catch (err) {
                try {
                    var fallback = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                    videoTrack = fallback.getVideoTracks()[0];
                    camera.srcObject = fallback;
                    errorScreen.classList.remove('show');
                } catch (e) {
                    errorScreen.classList.add('show');
                }
            }
        }

        zoomSlider.addEventListener('input', function() {
            if (!videoTrack || !zoomRange) return;
            var z = parseInt(zoomSlider.value) / 100;
            videoTrack.applyConstraints({ advanced: [{ zoom: z }] }).catch(function(){});
            zoomVal.textContent = z.toFixed(1) + 'x';
        });

        // ── Wake Lock & Orientation ──

        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            try {
                wakeLockSentinel = await navigator.wakeLock.request('screen');
                wakeLockSentinel.addEventListener('release', function() { wakeLockSentinel = null; });
            } catch (e) {}
        }

        function lockOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(function(){});
            }
        }

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') requestWakeLock();
        });

        // ── Image Upload ──

        uploadBtn.addEventListener('click', function() { fileInput.click(); });
        changeBtn.addEventListener('click', function() { fileInput.click(); });

        fileInput.addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                var img = new Image();
                img.onload = function() {
                    imgNatW = img.naturalWidth;
                    imgNatH = img.naturalHeight;
                    sizeSlider.value = 100;
                    sizeVal.textContent = '100%';
                    calcBaseRect(100);
                    resetCorners();
                    overlay.src = ev.target.result;
                    overlay.style.display = 'block';
                    overlay.style.opacity = opacitySlider.value / 100;
                    applyTransform();
                    showControls();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            fileInput.value = '';
        });

        function showControls() {
            opacityWrap.classList.add('show');
            sizeWrap.classList.add('show');
            changeBtn.classList.add('show');
            cornerEls.forEach(function(el) { el.style.display = 'block'; });
            cornerLine.style.display = 'block';
            imageLoaded = true;
        }

        function calcBaseRect(pct) {
            var vw = window.innerWidth;
            var vh = window.innerHeight;
            var scale = pct / 100;
            var ratio = imgNatW / imgNatH;
            var w, h;
            if (ratio > vw / vh) {
                w = vw * scale;
                h = w / ratio;
            } else {
                h = vh * scale;
                w = h * ratio;
            }
            baseRect.w = w;
            baseRect.h = h;
            baseRect.x = (vw - w) / 2;
            baseRect.y = (vh - h) / 2;
        }

        function resetCorners() {
            corners[0] = [baseRect.x, baseRect.y];
            corners[1] = [baseRect.x + baseRect.w, baseRect.y];
            corners[2] = [baseRect.x + baseRect.w, baseRect.y + baseRect.h];
            corners[3] = [baseRect.x, baseRect.y + baseRect.h];
            updateCornerEls();
        }

        function updateCornerEls() {
            for (var i = 0; i < 4; i++) {
                cornerEls[i].style.left = (corners[i][0] - 24) + 'px';
                cornerEls[i].style.top = (corners[i][1] - 24) + 'px';
            }
            cornerPoly.setAttribute('points',
                corners.map(function(c) { return c[0] + ',' + c[1]; }).join(' ')
            );
        }

        // ── Sliders ──

        opacitySlider.addEventListener('input', function() {
            overlay.style.opacity = opacitySlider.value / 100;
            opacityVal.textContent = opacitySlider.value + '%';
        });

        sizeSlider.addEventListener('input', function() {
            var val = parseInt(sizeSlider.value);
            sizeVal.textContent = val + '%';
            calcBaseRect(val);
            resetCorners();
            applyTransform();
        });

        // ── Perspective Transform ──

        function solveLinearSystem(A) {
            var n = A.length;
            for (var col = 0; col < n; col++) {
                var maxRow = col;
                for (var row = col + 1; row < n; row++) {
                    if (Math.abs(A[row][col]) > Math.abs(A[maxRow][col])) maxRow = row;
                }
                var tmp = A[col]; A[col] = A[maxRow]; A[maxRow] = tmp;
                if (Math.abs(A[col][col]) < 1e-10) return null;
                for (var row = col + 1; row < n; row++) {
                    var f = A[row][col] / A[col][col];
                    for (var j = col; j <= n; j++) {
                        A[row][j] -= f * A[col][j];
                    }
                }
            }
            var x = new Array(n);
            for (var i = n - 1; i >= 0; i--) {
                x[i] = A[i][n];
                for (var j = i + 1; j < n; j++) {
                    x[i] -= A[i][j] * x[j];
                }
                x[i] /= A[i][i];
            }
            return x;
        }

        function computeMatrix3d(sw, sh, dst) {
            var src = [[0, 0], [sw, 0], [sw, sh], [0, sh]];
            var A = [];
            for (var i = 0; i < 4; i++) {
                var sx = src[i][0], sy = src[i][1];
                var dx = dst[i][0], dy = dst[i][1];
                A.push([sx, sy, 1, 0, 0, 0, -dx * sx, -dx * sy, dx]);
                A.push([0, 0, 0, sx, sy, 1, -dy * sx, -dy * sy, dy]);
            }
            var h = solveLinearSystem(A);
            if (!h) return 'none';
            return 'matrix3d(' +
                h[0] + ',' + h[3] + ',0,' + h[6] + ',' +
                h[1] + ',' + h[4] + ',0,' + h[7] + ',' +
                '0,0,1,0,' +
                h[2] + ',' + h[5] + ',0,1)';
        }

        function applyTransform() {
            overlay.style.width = baseRect.w + 'px';
            overlay.style.height = baseRect.h + 'px';
            overlay.style.left = baseRect.x + 'px';
            overlay.style.top = baseRect.y + 'px';

            var dst = corners.map(function(c) {
                return [c[0] - baseRect.x, c[1] - baseRect.y];
            });
            overlay.style.transform = computeMatrix3d(baseRect.w, baseRect.h, dst);
            updateCornerEls();
        }

        // ── Interaction: Corner Drag + Long-press Move ──

        var dragIndex = -1;
        var moveMode = false;
        var longPressTimer = null;
        var touchStartPos = null;
        var lastTouchPos = null;
        var LONG_PRESS_MS = 400;
        var MOVE_THRESHOLD = 10;

        function getTouchPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function isOnUI(e) {
            var el = e.target;
            while (el) {
                if (el === bottomBar || el.tagName === 'INPUT' || el.tagName === 'BUTTON') return true;
                el = el.parentElement;
            }
            return false;
        }

        function isOnCorner(e) {
            for (var i = 0; i < 4; i++) {
                if (e.target === cornerEls[i]) return true;
            }
            return false;
        }

        // Corner drag — listeners only added during drag
        function startCornerDrag(idx, e) {
            e.preventDefault();
            dragIndex = idx;
            cornerEls[idx].classList.add('dragging');
            document.addEventListener('touchmove', onCornerDragMove, { passive: false });
            document.addEventListener('mousemove', onCornerDragMove);
            document.addEventListener('touchend', endCornerDrag);
            document.addEventListener('mouseup', endCornerDrag);
        }

        function onCornerDragMove(e) {
            if (dragIndex < 0) return;
            e.preventDefault();
            var pos = getTouchPos(e);
            corners[dragIndex] = [pos.x, pos.y];
            applyTransform();
        }

        function endCornerDrag() {
            if (dragIndex >= 0) {
                cornerEls[dragIndex].classList.remove('dragging');
                dragIndex = -1;
            }
            document.removeEventListener('touchmove', onCornerDragMove);
            document.removeEventListener('mousemove', onCornerDragMove);
            document.removeEventListener('touchend', endCornerDrag);
            document.removeEventListener('mouseup', endCornerDrag);
        }

        cornerEls.forEach(function(el, i) {
            el.addEventListener('touchstart', function(e) { startCornerDrag(i, e); }, { passive: false });
            el.addEventListener('mousedown', function(e) { startCornerDrag(i, e); });
        });

        // Long-press move — touch on the canvas area
        function onScreenTouchStart(e) {
            if (!imageLoaded) return;
            if (isOnUI(e) || isOnCorner(e)) return;

            var pos = getTouchPos(e);
            touchStartPos = pos;
            lastTouchPos = pos;

            longPressTimer = setTimeout(function() {
                moveMode = true;
                moveHint.classList.add('show');
                cornerLine.classList.add('moving');
                if (navigator.vibrate) navigator.vibrate(30);
            }, LONG_PRESS_MS);
        }

        function onScreenTouchMove(e) {
            var pos = getTouchPos(e);

            // Cancel long-press if moved before timer
            if (longPressTimer && touchStartPos) {
                var dx = pos.x - touchStartPos.x;
                var dy = pos.y - touchStartPos.y;
                if (Math.sqrt(dx * dx + dy * dy) > MOVE_THRESHOLD) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            }

            // Move image
            if (moveMode) {
                e.preventDefault();
                var deltaX = pos.x - lastTouchPos.x;
                var deltaY = pos.y - lastTouchPos.y;
                for (var i = 0; i < 4; i++) {
                    corners[i][0] += deltaX;
                    corners[i][1] += deltaY;
                }
                baseRect.x += deltaX;
                baseRect.y += deltaY;
                applyTransform();
                lastTouchPos = pos;
            }
        }

        function onScreenTouchEnd() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
            if (moveMode) {
                moveMode = false;
                moveHint.classList.remove('show');
                cornerLine.classList.remove('moving');
            }
            touchStartPos = null;
            lastTouchPos = null;
        }

        document.addEventListener('touchstart', onScreenTouchStart, { passive: true });
        document.addEventListener('touchmove', onScreenTouchMove, { passive: false });
        document.addEventListener('touchend', onScreenTouchEnd);

        // Mouse fallback for long-press (desktop testing)
        var mouseDown = false;
        document.addEventListener('mousedown', function(e) {
            if (!imageLoaded || isOnUI(e) || isOnCorner(e)) return;
            mouseDown = true;
            var pos = getTouchPos(e);
            touchStartPos = pos;
            lastTouchPos = pos;
            longPressTimer = setTimeout(function() {
                moveMode = true;
                moveHint.classList.add('show');
                cornerLine.classList.add('moving');
            }, LONG_PRESS_MS);
        });
        document.addEventListener('mousemove', function(e) {
            if (!mouseDown) return;
            var pos = getTouchPos(e);
            if (longPressTimer && touchStartPos) {
                var dx = pos.x - touchStartPos.x;
                var dy = pos.y - touchStartPos.y;
                if (Math.sqrt(dx * dx + dy * dy) > MOVE_THRESHOLD) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            }
            if (moveMode) {
                var deltaX = pos.x - lastTouchPos.x;
                var deltaY = pos.y - lastTouchPos.y;
                for (var i = 0; i < 4; i++) {
                    corners[i][0] += deltaX;
                    corners[i][1] += deltaY;
                }
                baseRect.x += deltaX;
                baseRect.y += deltaY;
                applyTransform();
                lastTouchPos = pos;
            }
        });
        document.addEventListener('mouseup', function() {
            mouseDown = false;
            onScreenTouchEnd();
        });

        // ── Init ──

        retryBtn.addEventListener('click', startCamera);
        startCamera();
        requestWakeLock();
        lockOrientation();
    </script>
</body>
</html>
